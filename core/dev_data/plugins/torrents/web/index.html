<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torrents</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f9fafb; font-family: sans-serif; }
        .dark-mode { background-color: #111827; color: #f9fafb; }
        .card { background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 0.5rem; }
        .dark-mode .card { background-color: #1f2937; border-color: #374151; }
    </style>
</head>
<body class="p-6 text-gray-900">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <span class="bg-purple-600 text-white p-1 rounded text-sm">TR</span>
                Торренты
            </h1>
        </header>

        <!-- Tabs Navigation -->
        <div class="flex border-b border-gray-200 mb-6">
            <button id="tab-tracking" onclick="switchTab('tracking')" class="px-4 py-2 border-b-2 font-medium text-sm text-purple-600 border-purple-600">Отслеживание</button>
            <button id="tab-search" onclick="switchTab('search')" class="px-4 py-2 border-b-2 font-medium text-sm text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300">Поиск</button>
            <button id="tab-settings" onclick="switchTab('settings')" class="px-4 py-2 border-b-2 font-medium text-sm text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300">Настройки</button>
        </div>

        <div id="error-banner" class="hidden mb-6 bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded"></div>
        <div id="success-banner" class="hidden mb-6 bg-emerald-50 border border-emerald-200 text-emerald-600 px-4 py-3 rounded"></div>

        <!-- Tracking Tab -->
        <div id="content-tracking" class="space-y-8">
            <div class="card p-6 shadow-sm">
                <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-2">
                    <h2 class="text-xl font-bold text-gray-800">Отслеживаемые сериалы</h2>
                </div>
                <div id="tracked-list" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
                    <!-- Populated dynamically -->
                    <div class="col-span-full text-center text-gray-500 py-4 text-sm">Нет отслеживаемых сериалов. Добавьте их через вкладку Поиск.</div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="card p-6 shadow-sm">
                    <h2 class="text-lg font-bold mb-4 text-gray-800 border-b border-gray-100 pb-2">Загрузки</h2>
                    <div id="downloads-list" class="space-y-3">
                        <!-- Populated dynamically -->
                        <div class="text-sm text-gray-500 py-2">Загрузок нет</div>
                    </div>
                </div>
                <div class="card p-6 shadow-sm">
                    <h2 class="text-lg font-bold mb-4 text-gray-800 border-b border-gray-100 pb-2">На отдаче</h2>
                    <div id="seeding-list" class="space-y-3">
                        <!-- Populated dynamically -->
                        <div class="text-sm text-gray-500 py-2">Раздач нет</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search Tab -->
        <div id="content-search" class="hidden dark-mode p-6 rounded-lg">
            <div class="mb-8 flex gap-4">
                <input type="text" id="searchInput" placeholder="Поиск фильма или сериала (TMDb)..."
                    class="flex-1 p-3 rounded bg-gray-800 border border-gray-700 focus:outline-none focus:border-purple-500">
                <button onclick="doSearch()" class="px-6 py-3 bg-purple-600 hover:bg-purple-700 rounded font-medium transition-colors">Искать</button>
            </div>

            <!-- TMDb Results -->
            <div id="tmdb-results" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 mb-12">
                <!-- Populated dynamically -->
            </div>

            <!-- Releases Section -->
            <div id="releases-section" class="hidden">
                <div class="flex justify-between items-end mb-4 border-b border-gray-700 pb-2">
                    <h2 id="releases-title" class="text-xl font-bold text-gray-200">Раздачи</h2>

                    <div class="flex gap-4">
                        <select id="catSelect" class="bg-gray-800 border border-gray-700 rounded p-1 text-sm focus:outline-none">
                            <option value="">Без категории</option>
                        </select>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-gray-400 uppercase bg-gray-800 border-b border-gray-700">
                            <tr>
                                <th class="px-4 py-3">Название</th>
                                <th class="px-4 py-3 w-24">Качество</th>
                                <th class="px-4 py-3 w-32">Озвучка</th>
                                <th class="px-4 py-3 w-24 text-right">Размер</th>
                                <th class="px-4 py-3 w-24 text-right">Сиды</th>
                                <th class="px-4 py-3 w-32 text-right">Действие</th>
                            </tr>
                        </thead>
                        <tbody id="releases-table-body">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Settings Tab -->
        <div id="content-settings" class="hidden">
            <div class="card p-8 shadow-sm">
                <h2 class="text-xl font-bold mb-6 text-gray-800">Настройки интеграции</h2>
                <form id="settingsForm" onsubmit="saveSettings(event)" class="max-w-2xl">

                    <h3 class="font-semibold text-gray-700 mt-6 mb-3 border-b border-gray-100 pb-1">TMDb</h3>
                    <div class="mb-4">
                        <label class="block mb-1 text-sm font-medium text-gray-700">API Key</label>
                        <input type="password" id="tmdb_api_key" placeholder="Скрыто" class="w-full p-2.5 rounded-md bg-white border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm">
                    </div>

                    <h3 class="font-semibold text-gray-700 mt-8 mb-3 border-b border-gray-100 pb-1">Prowlarr</h3>
                    <div class="mb-4">
                        <label class="block mb-1 text-sm font-medium text-gray-700">URL</label>
                        <input type="text" id="prowlarr_url" class="w-full p-2.5 rounded-md bg-white border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm">
                    </div>
                    <div class="mb-4">
                        <label class="block mb-1 text-sm font-medium text-gray-700">API Key</label>
                        <input type="password" id="prowlarr_api_key" placeholder="Скрыто" class="w-full p-2.5 rounded-md bg-white border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm">
                    </div>

                    <h3 class="font-semibold text-gray-700 mt-8 mb-3 border-b border-gray-100 pb-1">qBittorrent</h3>
                    <div class="mb-4">
                        <label class="block mb-1 text-sm font-medium text-gray-700">URL</label>
                        <input type="text" id="qbit_url" class="w-full p-2.5 rounded-md bg-white border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm">
                    </div>
                    <div class="mb-4">
                        <label class="block mb-1 text-sm font-medium text-gray-700">Username</label>
                        <input type="text" id="qbit_username" class="w-full p-2.5 rounded-md bg-white border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm">
                    </div>
                    <div class="mb-8">
                        <label class="block mb-1 text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="qbit_password" placeholder="Скрыто" class="w-full p-2.5 rounded-md bg-white border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm">
                    </div>

                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-md font-medium transition-colors text-sm">
                        Сохранить
                    </button>
                </form>
            </div>
        </div>

    </div>

    <script>
        const getBasePath = () => {
            const path = window.location.pathname;
            return path.replace(/\/+$/, '').replace(/\/index\.html$/, '');
        };
        const basePath = getBasePath();

        const formatBytes = (bytes) => {
            if (bytes === 0) return '0 B';
            const k = 1024, dm = 2, sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        };

        const showError = (msg) => {
            const el = document.getElementById('error-banner');
            el.innerText = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        };

        const showSuccess = (msg) => {
            const el = document.getElementById('success-banner');
            el.innerText = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        };

        let state = {
            plugin_id: null,
            config: {},
            tracked: []
        };

        const switchTab = (tab) => {
            document.getElementById('content-tracking').classList.add('hidden');
            document.getElementById('content-search').classList.add('hidden');
            document.getElementById('content-settings').classList.add('hidden');

            document.getElementById('tab-tracking').className = 'px-4 py-2 border-b-2 font-medium text-sm text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300';
            document.getElementById('tab-search').className = 'px-4 py-2 border-b-2 font-medium text-sm text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300';
            document.getElementById('tab-settings').className = 'px-4 py-2 border-b-2 font-medium text-sm text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300';

            if (tab === 'tracking') {
                document.getElementById('content-tracking').classList.remove('hidden');
                document.getElementById('tab-tracking').className = 'px-4 py-2 border-b-2 font-medium text-sm text-purple-600 border-purple-600';
                loadTracking();
                loadQbitInfo();
            } else if (tab === 'search') {
                document.getElementById('content-search').classList.remove('hidden');
                document.getElementById('tab-search').className = 'px-4 py-2 border-b-2 font-medium text-sm text-purple-600 border-purple-600';
            } else {
                document.getElementById('content-settings').classList.remove('hidden');
                document.getElementById('tab-settings').className = 'px-4 py-2 border-b-2 font-medium text-sm text-purple-600 border-purple-600';
                loadSettings();
            }
        };

        const loadSettings = async () => {
            try {
                const res = await fetch(`/api/plugins/${state.plugin_id}/config`);
                state.config = await res.json();

                document.getElementById('tmdb_api_key').value = state.config.tmdb_api_key === '***' ? '' : state.config.tmdb_api_key || '';
                document.getElementById('prowlarr_url').value = state.config.prowlarr_url || '';
                document.getElementById('prowlarr_api_key').value = state.config.prowlarr_api_key === '***' ? '' : state.config.prowlarr_api_key || '';
                document.getElementById('qbit_url').value = state.config.qbit_url || '';
                document.getElementById('qbit_username').value = state.config.qbit_username || '';
                document.getElementById('qbit_password').value = state.config.qbit_password === '***' ? '' : state.config.qbit_password || '';
            } catch (e) {
                console.error("Failed to load config", e);
            }
        };

        const saveSettings = async (e) => {
            e.preventDefault();
            const configData = {
                ...state.config,
                prowlarr_url: document.getElementById('prowlarr_url').value,
                qbit_url: document.getElementById('qbit_url').value,
                qbit_username: document.getElementById('qbit_username').value
            };

            const tmdb = document.getElementById('tmdb_api_key').value;
            if (tmdb) configData.tmdb_api_key = tmdb;
            const prowlarr = document.getElementById('prowlarr_api_key').value;
            if (prowlarr) configData.prowlarr_api_key = prowlarr;
            const qbit = document.getElementById('qbit_password').value;
            if (qbit) configData.qbit_password = qbit;

            try {
                const res = await fetch(`/api/plugins/${state.plugin_id}/config`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ config: configData })
                });
                if (res.ok) {
                    showSuccess('Настройки успешно сохранены');
                    document.getElementById('tmdb_api_key').value = '';
                    document.getElementById('prowlarr_api_key').value = '';
                    document.getElementById('qbit_password').value = '';
                } else {
                    showError('Ошибка сохранения настроек');
                }
            } catch (err) {
                showError(err.message);
            }
        };

        const loadTracking = async () => {
            try {
                const res = await fetch(`${basePath}/api/tracked`);
                if (res.ok) {
                    state.tracked = await res.json();
                    renderTracked();
                }
            } catch (e) { console.error(e); }
        };

        const addTracking = async (id, title, year, poster) => {
            try {
                await fetch(`${basePath}/api/tracked`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ tmdb_id: id, title, year, poster })
                });
                showSuccess("Добавлено в отслеживаемое");
            } catch (e) { showError(e.message); }
        };

        const removeTracking = async (id) => {
            try {
                await fetch(`${basePath}/api/tracked/${id}`, { method: 'DELETE' });
                await loadTracking();
            } catch (e) { showError(e.message); }
        };

        const renderTracked = () => {
            const container = document.getElementById('tracked-list');
            if (!state.tracked || state.tracked.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center text-gray-500 py-4 text-sm">Нет отслеживаемых сериалов. Добавьте их через вкладку Поиск.</div>';
                return;
            }

            container.innerHTML = '';
            state.tracked.forEach(item => {
                const card = document.createElement('div');
                card.className = 'border border-gray-200 rounded-lg overflow-hidden flex flex-col group relative';

                const imgUrl = item.poster || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="%234b5563" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>';

                card.innerHTML = `
                    <button onclick="removeTracking(${item.tmdb_id})" class="absolute top-2 right-2 bg-red-500 text-white w-6 h-6 rounded-full opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-xs shadow-md">×</button>
                    <div class="h-48 bg-gray-100 relative">
                        <img src="${imgUrl}" class="w-full h-full object-cover ${item.poster ? '' : 'p-6 opacity-20'}" />
                    </div>
                    <div class="p-3 flex-1 flex flex-col justify-between bg-white">
                        <h3 class="font-medium text-sm leading-tight text-gray-800">${item.title} <span class="text-gray-500 font-normal">(${item.year})</span></h3>
                        <button onclick="searchTracked('${item.title.replace(/'/g, "\\'")}', '${item.year}')" class="mt-3 text-xs font-medium text-purple-600 hover:text-purple-800 text-left">Искать раздачи →</button>
                    </div>
                `;
                container.appendChild(card);
            });
        };

        const searchTracked = (title, year) => {
            switchTab('search');
            document.getElementById('searchInput').value = `${title} ${year}`;
            doSearch();
            setTimeout(() => loadReleases(title, year), 500);
        };

        const loadQbitInfo = async () => {
            try {
                const res = await fetch(`${basePath}/api/downloads`);
                if (res.ok) {
                    const data = await res.json();

                    const dlContainer = document.getElementById('downloads-list');
                    if (data.downloading.length === 0) {
                        dlContainer.innerHTML = '<div class="text-sm text-gray-500 py-2">Загрузок нет</div>';
                    } else {
                        dlContainer.innerHTML = '';
                        data.downloading.forEach(t => {
                            const pct = (t.progress * 100).toFixed(1);
                            dlContainer.innerHTML += `
                                <div class="bg-gray-50 p-3 rounded border border-gray-100">
                                    <div class="text-sm font-medium text-gray-800 truncate mb-2" title="${t.name}">${t.name}</div>
                                    <div class="flex justify-between text-xs text-gray-500 mb-1">
                                        <span>${formatBytes(t.dlspeed)}/s</span>
                                        <span>${pct}%</span>
                                    </div>
                                    <div class="w-full bg-gray-200 rounded-full h-1.5">
                                        <div class="bg-purple-500 h-1.5 rounded-full" style="width: ${pct}%"></div>
                                    </div>
                                </div>
                            `;
                        });
                    }

                    const upContainer = document.getElementById('seeding-list');
                    if (data.seeding.length === 0) {
                        upContainer.innerHTML = '<div class="text-sm text-gray-500 py-2">Раздач нет</div>';
                    } else {
                        upContainer.innerHTML = '';
                        data.seeding.forEach(t => {
                            upContainer.innerHTML += `
                                <div class="bg-gray-50 p-3 rounded border border-gray-100 flex justify-between items-center">
                                    <div class="text-sm font-medium text-gray-800 truncate flex-1 pr-4" title="${t.name}">${t.name}</div>
                                    <div class="text-xs text-emerald-600 font-medium whitespace-nowrap">↑ ${formatBytes(t.upspeed)}/s</div>
                                </div>
                            `;
                        });
                    }
                }
            } catch (e) { console.error(e); }
        };

        let currentCategories = [];
        const loadCategories = async () => {
            try {
                const res = await fetch(`${basePath}/api/categories`);
                const data = await res.json();
                const sel = document.getElementById('catSelect');
                data.categories.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c; opt.innerText = c;
                    sel.appendChild(opt);
                });
            } catch (e) {
                console.error("No categories loaded", e);
            }
        };

        const doSearch = async () => {
            const query = document.getElementById('searchInput').value;
            if (!query) return;

            document.getElementById('releases-section').classList.add('hidden');
            const container = document.getElementById('tmdb-results');
            container.innerHTML = '<div class="col-span-full text-center text-gray-500 py-8">Поиск...</div>';

            try {
                const res = await fetch(`${basePath}/api/search?query=${encodeURIComponent(query)}`);
                const data = await res.json();

                if (!data.results || data.results.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center text-gray-500 py-8">Ничего не найдено</div>';
                    return;
                }

                container.innerHTML = '';
                data.results.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card overflow-hidden hover:ring-2 hover:ring-purple-500 cursor-pointer transition-all flex flex-col group relative';

                    const imgUrl = item.poster || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="%234b5563" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>';

                    card.innerHTML = `
                        <button onclick="event.stopPropagation(); addTracking(${item.id}, '${item.title.replace(/'/g, "\\'")}', '${item.year}', '${imgUrl}')" class="absolute top-2 right-2 bg-gray-900/80 text-white p-1.5 rounded hover:bg-emerald-600 transition-colors z-10 text-xs shadow-md" title="Отслеживать">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        </button>
                        <div class="h-64 bg-gray-800 relative" onclick="loadReleases('${item.title.replace(/'/g, "\\'")}', '${item.year}')">
                            <img src="${imgUrl}" class="w-full h-full object-cover ${item.poster ? '' : 'p-8 opacity-20'}" />
                            <div class="absolute bottom-0 w-full bg-gradient-to-t from-gray-900 to-transparent p-3 pt-12">
                                <span class="bg-gray-800/80 text-xs px-2 py-1 rounded text-gray-300 font-mono">${item.year}</span>
                            </div>
                        </div>
                        <div class="p-3 flex-1 flex flex-col justify-between" onclick="loadReleases('${item.title.replace(/'/g, "\\'")}', '${item.year}')">
                            <h3 class="font-medium text-sm leading-tight text-gray-200 group-hover:text-purple-400">${item.title}</h3>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                showError(e.message);
                container.innerHTML = '';
            }
        };

        const loadReleases = async (title, year) => {
            const section = document.getElementById('releases-section');
            const tbody = document.getElementById('releases-table-body');
            const titleEl = document.getElementById('releases-title');

            section.classList.remove('hidden');
            titleEl.innerText = `Раздачи: ${title} (${year})`;
            tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">Поиск в Prowlarr...</td></tr>';

            try {
                const res = await fetch(`${basePath}/api/releases?title=${encodeURIComponent(title)}&year=${encodeURIComponent(year)}`);
                const data = await res.json();

                if (!data.releases || data.releases.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">Раздач не найдено</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                data.releases.forEach(r => {
                    const tr = document.createElement('tr');
                    tr.className = 'border-b border-gray-800 hover:bg-gray-800/50';

                    let qClass = 'bg-gray-700 text-gray-300';
                    if (r.info.quality === '4K') qClass = 'bg-yellow-900/50 text-yellow-500 border border-yellow-700';
                    if (r.info.quality === '1080p') qClass = 'bg-blue-900/50 text-blue-400 border border-blue-700';

                    const qBadge = `<span class="px-2 py-0.5 rounded text-xs font-mono ${qClass}">${r.info.quality}</span>`;
                    const hdrBadge = r.info.hdr ? `<span class="ml-1 px-1 py-0.5 rounded text-xs bg-purple-900/30 text-purple-400 border border-purple-800">${r.info.hdr}</span>` : '';

                    tr.innerHTML = `
                        <td class="px-4 py-3 font-medium text-gray-200 truncate max-w-xs" title="${r.title}">${r.title}</td>
                        <td class="px-4 py-3">${qBadge}${hdrBadge}</td>
                        <td class="px-4 py-3 text-gray-400 text-xs">${r.info.voice}</td>
                        <td class="px-4 py-3 text-right text-gray-400 font-mono text-xs">${formatBytes(r.size)}</td>
                        <td class="px-4 py-3 text-right">
                            <span class="text-emerald-500 font-bold">${r.seeders}</span>
                            <span class="text-gray-600 text-xs mx-1">/</span>
                            <span class="text-red-400 text-xs">${r.peers}</span>
                        </td>
                        <td class="px-4 py-3 text-right">
                            <button onclick="download('${r.magnetUrl}')" class="px-3 py-1.5 bg-purple-600 hover:bg-purple-700 rounded text-sm font-medium transition-colors">
                                Скачать
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                showError(e.message);
                tbody.innerHTML = '';
            }
        };

        const download = async (url) => {
            const cat = document.getElementById('catSelect').value;
            try {
                const res = await fetch(`${basePath}/api/download`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ url: url, category: cat })
                });

                if (res.ok) {
                    showSuccess("Торрент успешно добавлен в qBittorrent");
                    loadQbitInfo(); // Refresh tracking list implicitly
                } else {
                    const data = await res.json();
                    showError(data.detail || "Ошибка добавления торрента");
                }
            } catch (e) {
                showError(e.message);
            }
        };

        // Init
        const init = async () => {
            const res = await fetch(`${basePath}/meta`);
            const meta = await res.json();
            state.plugin_id = meta.plugin_id;

            loadCategories();
            switchTab('tracking');
            setInterval(() => {
                if (document.getElementById('content-tracking').className.includes('hidden') === false) {
                    loadQbitInfo();
                }
            }, 5000);
        };

        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') doSearch();
        });

        init();
    </script>
</body>
</html>
