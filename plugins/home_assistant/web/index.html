<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f9fafb; font-family: sans-serif; }
        .dark-mode { background-color: #111827; color: #f9fafb; }
        .card { background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 0.5rem; }
        .dark-mode .card { background-color: #1f2937; border-color: #374151; }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #10b981;
            cursor: pointer;
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #d1d5db;
            border-radius: 2px;
        }
        .dark-mode input[type=range]::-webkit-slider-runnable-track {
            background: #4b5563;
        }
    </style>
</head>
<body class="p-6 text-gray-900">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <span class="bg-blue-600 text-white p-1 rounded text-sm">HA</span>
                Home Assistant
            </h1>
            <div id="status-badge" class="px-3 py-1 rounded text-sm font-medium bg-gray-200 text-gray-700">
                Загрузка...
            </div>
        </header>

        <!-- Tabs Navigation -->
        <div class="flex border-b border-gray-200 mb-6">
            <button id="tab-groups" onclick="switchTab('groups')" class="px-4 py-2 border-b-2 font-medium text-sm text-blue-600 border-blue-600">Рабочий экран</button>
            <button id="tab-settings" onclick="switchTab('settings')" class="px-4 py-2 border-b-2 font-medium text-sm text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300">Настройки</button>
        </div>

        <div id="error-banner" class="hidden mb-6 bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded">
        </div>
        <div id="success-banner" class="hidden mb-6 bg-emerald-50 border border-emerald-200 text-emerald-600 px-4 py-3 rounded">
        </div>

        <!-- Groups Tab -->
        <div id="content-groups" class="space-y-6">
            <!-- Group Management Block -->
            <div class="card p-6 shadow-sm mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-800">Мои группы Telegram</h2>
                    <button onclick="openGroupModal()" class="px-4 py-2 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700">Создать группу</button>
                </div>

                <div class="mb-4 flex items-center gap-2">
                    <input type="checkbox" id="only_custom_groups" class="rounded border-gray-300 text-blue-600 shadow-sm focus:border-blue-300 focus:ring focus:ring-blue-200 focus:ring-opacity-50" onchange="toggleOnlyCustomGroups(this.checked)">
                    <label for="only_custom_groups" class="text-sm text-gray-700">Показывать в Telegram только мои группы (скрыть авто-группы)</label>
                </div>

                <div id="custom-groups-list" class="space-y-3">
                    <!-- Groups injected here -->
                </div>
            </div>

            <!-- Modal for Group Editing -->
            <div id="group-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
                <div class="relative top-20 mx-auto p-6 border w-full max-w-2xl shadow-lg rounded-lg bg-white">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold text-gray-900" id="group-modal-title">Создать группу</h3>
                        <button onclick="closeGroupModal()" class="text-gray-400 hover:text-gray-600">&times;</button>
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Название группы</label>
                        <input type="text" id="group-name-input" class="w-full rounded border-gray-300 shadow-sm focus:border-blue-300 focus:ring focus:ring-blue-200 focus:ring-opacity-50" placeholder="Например: Свет в гостиной">
                        <input type="hidden" id="group-original-name">
                    </div>

                    <div class="mb-4">
                        <input type="text" id="entity-search-input" onkeyup="filterEntities()" class="w-full rounded border-gray-300 shadow-sm text-sm" placeholder="Поиск устройств...">
                    </div>

                    <div class="h-64 overflow-y-auto border border-gray-200 rounded p-2 mb-4" id="entities-checkbox-list">
                        <!-- Checkboxes injected here -->
                    </div>

                    <div class="flex justify-end gap-3">
                        <button onclick="closeGroupModal()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded hover:bg-gray-200">Отмена</button>
                        <button onclick="saveGroup()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Сохранить</button>
                    </div>
                </div>
            </div>

            <!-- Entities Block -->
            <div class="dark-mode p-6 rounded-lg">
                <div id="domains-container" class="space-y-8">
                    <!-- Dynamic content injected here -->
                </div>
            </div>
        </div>


        <!-- Settings Tab -->
        <div id="content-settings" class="hidden">
            <div class="card p-8 shadow-sm">
                <h2 class="text-xl font-bold mb-6 text-gray-800">Настройки интеграции</h2>
                <form id="settingsForm" onsubmit="saveSettings(event)" class="max-w-2xl">
                    <div class="mb-4">
                        <label class="block mb-2 text-sm font-medium text-gray-700">Home Assistant URL</label>
                        <input type="text" id="ha_url" class="w-full p-2.5 rounded-md bg-white border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm" required>
                    </div>
                    <div class="mb-4">
                        <label class="block mb-2 text-sm font-medium text-gray-700">HA Token (Long-Lived Access Token)</label>
                        <input type="password" id="ha_token" placeholder="Скрыто" class="w-full p-2.5 rounded-md bg-white border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm">
                    </div>
                    <div class="mb-6">
                        <label class="block mb-2 text-sm font-medium text-gray-700">Интервал обновления (секунд)</label>
                        <input type="number" id="poll_seconds" class="w-full p-2.5 rounded-md bg-white border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm">
                    </div>
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-md font-medium transition-colors text-sm">
                        Сохранить
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const getBasePath = () => {
            const path = window.location.pathname;
            return path.replace(/\/+$/, '').replace(/\/index\.html$/, '');
        };
        const basePath = getBasePath();

        let state = {
            entities: [],
            status: null,
            plugin_id: null,
            config: {}
        };

        const showMessage = (id, msg) => {
            const el = document.getElementById(id);
            el.innerText = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        };

        const switchTab = (tab) => {
            document.getElementById('content-groups').classList.add('hidden');
            document.getElementById('content-settings').classList.add('hidden');

            document.getElementById('tab-groups').className = 'px-4 py-2 border-b-2 font-medium text-sm text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300';
            document.getElementById('tab-settings').className = 'px-4 py-2 border-b-2 font-medium text-sm text-gray-500 border-transparent hover:text-gray-700 hover:border-gray-300';

            if (tab === 'groups') {
                document.getElementById('content-groups').classList.remove('hidden');
                document.getElementById('tab-groups').className = 'px-4 py-2 border-b-2 font-medium text-sm text-blue-600 border-blue-600';
                loadConfigForGroups();
            } else {
                document.getElementById('content-settings').classList.remove('hidden');
                document.getElementById('tab-settings').className = 'px-4 py-2 border-b-2 font-medium text-sm text-blue-600 border-blue-600';
                loadSettings();
            }
        };

        const loadSettings = async () => {
            if (!state.plugin_id) {
                const res = await fetch(`${basePath}/meta`);
                const meta = await res.json();
                state.plugin_id = meta.plugin_id;
            }
            try {
                const res = await fetch(`/api/plugins/${state.plugin_id}/config`);
                state.config = await res.json();

                document.getElementById('ha_url').value = state.config.ha_url || '';
                document.getElementById('ha_token').value = state.config.ha_token === '***' ? '' : state.config.ha_token;
                document.getElementById('poll_seconds').value = state.config.poll_seconds || 30;
            } catch (e) {
                console.error("Failed to load config", e);
            }
        };

        const saveSettings = async (e) => {
            e.preventDefault();
            const configData = {
                ...state.config,
                ha_url: document.getElementById('ha_url').value,
                poll_seconds: parseInt(document.getElementById('poll_seconds').value)
            };

            const token = document.getElementById('ha_token').value;
            if (token) configData.ha_token = token;

            try {
                const res = await fetch(`/api/plugins/${state.plugin_id}/config`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ config: configData })
                });
                if (res.ok) {
                    showMessage('success-banner', 'Настройки успешно сохранены');
                    document.getElementById('ha_token').value = '';
                } else {
                    showMessage('error-banner', 'Ошибка сохранения настроек');
                }
            } catch (err) {
                showMessage('error-banner', err.message);
            }
        };

        const fetchStatus = async () => {
            try {
                const res = await fetch(`${basePath}/status`);
                state.status = await res.json();

                const badge = document.getElementById('status-badge');
                if (state.status.ready) {
                    badge.className = 'px-3 py-1 rounded text-sm font-medium bg-emerald-100 text-emerald-700 border border-emerald-200';
                    badge.innerText = 'Подключено';
                    document.getElementById('error-banner').classList.add('hidden');
                } else {
                    badge.className = 'px-3 py-1 rounded text-sm font-medium bg-red-100 text-red-700 border border-red-200';
                    badge.innerText = 'Ошибка';

                    if (state.status.last_error) {
                        showMessage('error-banner', state.status.last_error);
                    }
                }
            } catch (e) {
                console.error(e);
            }
        };

        const fetchEntities = async () => {
            if (!state.status || !state.status.ready) return;
            try {
                const res = await fetch(`${basePath}/api/entities`);
                state.entities = await res.json();
                renderEntities();
            } catch (e) {
                console.error(e);
            }
        };

        const controlEntity = async (entity_id, service, service_data = {}) => {
            try {
                await fetch(`${basePath}/api/control`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ entity_id, service, service_data })
                });
                setTimeout(fetchEntities, 500);
            } catch (e) {
                console.error('Control failed', e);
            }
        };


        const loadConfigForGroups = async () => {
            if (!state.plugin_id) return;
            try {
                const res = await fetch(`/api/plugins/${state.plugin_id}/config`);
                state.config = await res.json();

                document.getElementById('only_custom_groups').checked = state.config.only_custom_groups === 'true' || state.config.only_custom_groups === true;
                renderCustomGroups();
            } catch (e) {
                console.error("Failed to load config for groups", e);
            }
        };

        const toggleOnlyCustomGroups = async (checked) => {
            try {
                const configData = { ...state.config, only_custom_groups: checked ? "true" : "false" };
                const res = await fetch(`/api/plugins/${state.plugin_id}/config`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ config: configData })
                });
                if (res.ok) {
                    state.config.only_custom_groups = checked ? "true" : "false";
                }
            } catch (err) {
                console.error("Failed to save flag", err);
            }
        };

        const getParsedGroups = () => {
            if (!state.config || !state.config.tg_groups) return {};
            try {
                if (typeof state.config.tg_groups === 'string') {
                    return JSON.parse(state.config.tg_groups);
                }
                return state.config.tg_groups;
            } catch (e) {
                return {};
            }
        };

        const renderCustomGroups = () => {
            const container = document.getElementById('custom-groups-list');
            const groups = getParsedGroups();
            container.innerHTML = '';

            const groupNames = Object.keys(groups);
            if (groupNames.length === 0) {
                container.innerHTML = '<div class="text-sm text-gray-500 italic">Нет созданных групп</div>';
                return;
            }

            groupNames.forEach(name => {
                const count = groups[name].length;
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-3 border border-gray-200 rounded hover:bg-gray-50 transition-colors bg-white';
                div.innerHTML = `
                    <div>
                        <div class="font-medium text-gray-800">${name}</div>
                        <div class="text-xs text-gray-500">Устройств: ${count}</div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="editGroup('${name}')" class="px-3 py-1 bg-gray-100 text-gray-700 rounded text-sm hover:bg-gray-200 border border-gray-300">Изменить</button>
                        <button onclick="deleteGroup('${name}')" class="px-3 py-1 bg-red-50 text-red-600 rounded text-sm hover:bg-red-100 border border-red-200">Удалить</button>
                    </div>
                `;
                container.appendChild(div);
            });
        };

        const renderEntitiesListForModal = (selectedEntities = []) => {
            const container = document.getElementById('entities-checkbox-list');
            container.innerHTML = '';

            if (!state.entities) return;

            state.entities.forEach(ent => {
                const name = ent.attributes.friendly_name || ent.entity_id;
                const isSelected = selectedEntities.includes(ent.entity_id);

                const label = document.createElement('label');
                label.className = 'entity-cb-item flex items-center gap-3 p-2 hover:bg-gray-50 border-b border-gray-100 cursor-pointer';
                label.innerHTML = `
                    <input type="checkbox" class="rounded text-blue-600 entity-checkbox" value="${ent.entity_id}" ${isSelected ? 'checked' : ''}>
                    <div>
                        <div class="text-sm font-medium text-gray-800">${name}</div>
                        <div class="text-xs text-gray-500 font-mono entity-id-text">${ent.entity_id}</div>
                    </div>
                `;
                container.appendChild(label);
            });
        };

        const filterEntities = () => {
            const term = document.getElementById('entity-search-input').value.toLowerCase();
            const items = document.querySelectorAll('.entity-cb-item');
            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                item.style.display = text.includes(term) ? 'flex' : 'none';
            });
        };

        const openGroupModal = () => {
            document.getElementById('group-modal-title').innerText = 'Создать группу';
            document.getElementById('group-name-input').value = '';
            document.getElementById('group-original-name').value = '';
            document.getElementById('entity-search-input').value = '';
            renderEntitiesListForModal([]);
            document.getElementById('group-modal').classList.remove('hidden');
        };

        const editGroup = (name) => {
            const groups = getParsedGroups();
            document.getElementById('group-modal-title').innerText = 'Изменить группу';
            document.getElementById('group-name-input').value = name;
            document.getElementById('group-original-name').value = name;
            document.getElementById('entity-search-input').value = '';
            renderEntitiesListForModal(groups[name] || []);
            document.getElementById('group-modal').classList.remove('hidden');
        };

        const closeGroupModal = () => {
            document.getElementById('group-modal').classList.add('hidden');
        };

        const saveGroup = async () => {
            const name = document.getElementById('group-name-input').value.trim();
            if (!name) {
                alert('Введите название группы');
                return;
            }

            const origName = document.getElementById('group-original-name').value;
            const selected = Array.from(document.querySelectorAll('.entity-checkbox:checked')).map(cb => cb.value);

            const groups = getParsedGroups();
            if (origName && origName !== name) {
                delete groups[origName];
            }
            groups[name] = selected;

            const configData = { ...state.config, tg_groups: JSON.stringify(groups) };

            try {
                const res = await fetch(`/api/plugins/${state.plugin_id}/config`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ config: configData })
                });
                if (res.ok) {
                    state.config.tg_groups = JSON.stringify(groups);
                    renderCustomGroups();
                    closeGroupModal();
                    showMessage('success-banner', 'Группа сохранена');
                } else {
                    alert('Ошибка сохранения группы');
                }
            } catch (err) {
                alert(err.message);
            }
        };

        const deleteGroup = async (name) => {
            if (!confirm(`Удалить группу "${name}"?`)) return;

            const groups = getParsedGroups();
            delete groups[name];

            const configData = { ...state.config, tg_groups: JSON.stringify(groups) };
            try {
                const res = await fetch(`/api/plugins/${state.plugin_id}/config`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ config: configData })
                });
                if (res.ok) {
                    state.config.tg_groups = JSON.stringify(groups);
                    renderCustomGroups();
                    showMessage('success-banner', 'Группа удалена');
                } else {
                    alert('Ошибка удаления группы');
                }
            } catch (err) {
                alert(err.message);
            }
        };

        const renderEntities = () => {

            const container = document.getElementById('domains-container');

            // Map standard entities
            const grouped = state.entities.reduce((acc, ent) => {
                const domain = ent.entity_id.split('.')[0];
                if (!acc[domain]) acc[domain] = [];
                acc[domain].push(ent);
                return acc;
            }, {});

            container.innerHTML = '';

            for (const [domain, items] of Object.entries(grouped)) {
                if (items.length === 0) continue;

                const section = document.createElement('div');

                const title = document.createElement('h2');
                title.className = 'text-lg font-semibold text-gray-400 uppercase tracking-wider mb-4 border-b border-gray-700 pb-2';
                title.innerText = domain;
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4';

                items.forEach(ent => {
                    const card = document.createElement('div');
                    card.className = 'card p-4 flex flex-col justify-between gap-4';

                    const name = ent.attributes.friendly_name || ent.entity_id;
                    const isOn = ['on', 'open', 'playing', 'unlocked'].includes(ent.state);

                    let iconHtml = `<div class="w-3 h-3 rounded-full ${isOn ? 'bg-emerald-500' : 'bg-gray-500'}"></div>`;

                    let controlsHtml = '';
                    if (['light', 'switch', 'input_boolean'].includes(domain)) {
                        controlsHtml = `
                            <button onclick="controlEntity('${ent.entity_id}', 'toggle')"
                                class="px-4 py-2 rounded text-sm font-medium transition-colors ${isOn ? 'bg-emerald-600 hover:bg-emerald-700 text-white' : 'bg-gray-700 hover:bg-gray-600 text-gray-200'}">
                                ${isOn ? 'Выключить' : 'Включить'}
                            </button>
                        `;

                        if (domain === 'light' && ent.attributes.brightness !== undefined) {
                            controlsHtml += `
                                <div class="mt-4 flex items-center gap-3">
                                    <span class="text-xs text-gray-400">☀️</span>
                                    <input type="range" min="0" max="255" value="${ent.attributes.brightness}"
                                        onchange="controlEntity('${ent.entity_id}', 'turn_on', {brightness: this.value})">
                                </div>
                            `;
                        }
                    } else if (domain === 'climate') {
                        controlsHtml = `
                            <div class="text-xs text-gray-400 mb-2">Целевая: ${ent.attributes.temperature || '--'}°C</div>
                            <div class="flex gap-2">
                                <button onclick="controlEntity('${ent.entity_id}', 'set_temperature', {temperature: ${(ent.attributes.temperature || 20) - 0.5}})" class="px-3 py-1 bg-gray-700 rounded hover:bg-gray-600">-</button>
                                <button onclick="controlEntity('${ent.entity_id}', 'set_temperature', {temperature: ${(ent.attributes.temperature || 20) + 0.5}})" class="px-3 py-1 bg-gray-700 rounded hover:bg-gray-600">+</button>
                            </div>
                        `;
                    } else if (domain === 'media_player') {
                        controlsHtml = `
                            <button onclick="controlEntity('${ent.entity_id}', 'media_play_pause')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded text-sm font-medium">⏯ Play/Pause</button>
                        `;
                    } else if (domain === 'cover') {
                        controlsHtml = `
                            <div class="flex gap-2">
                                <button onclick="controlEntity('${ent.entity_id}', 'open_cover')" class="px-3 py-1 bg-gray-700 rounded hover:bg-gray-600">⬆️</button>
                                <button onclick="controlEntity('${ent.entity_id}', 'stop_cover')" class="px-3 py-1 bg-gray-700 rounded hover:bg-gray-600">⏹️</button>
                                <button onclick="controlEntity('${ent.entity_id}', 'close_cover')" class="px-3 py-1 bg-gray-700 rounded hover:bg-gray-600">⬇️</button>
                            </div>
                        `;
                    } else {
                        // Sensors or unknown domains just show state
                        controlsHtml = `<div class="text-lg font-medium">${ent.state} <span class="text-sm text-gray-400">${ent.attributes.unit_of_measurement || ''}</span></div>`;
                    }

                    card.innerHTML = `
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                ${iconHtml}
                                <h3 class="font-medium text-gray-100 truncate" title="${name}">${name}</h3>
                            </div>
                            <div class="text-xs text-gray-500 font-mono truncate">${ent.entity_id}</div>
                        </div>
                        <div>
                            ${controlsHtml}
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            }
        };

        // Main Loop
        const init = async () => {
            const res = await fetch(`${basePath}/meta`);
            const meta = await res.json();
            state.plugin_id = meta.plugin_id;

            await loadConfigForGroups();
            await fetchStatus();
            await fetchEntities();
            setInterval(async () => {
                await fetchStatus();
                await fetchEntities();
            }, 5000);
        };

        init();
    </script>
</body>
</html>
